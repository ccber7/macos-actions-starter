name: macOS CI & Automation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      python_version:
        description: 'Versi Python yang digunakan'
        required: true
        default: '3.13'
        type: choice
        options:
          - '3.13'
          - '3.12'
          - '3.11'
      run_playwright_check:
        description: 'Jalankan pengujian browser headless (Playwright)'
        required: false
        default: false
        type: boolean

jobs:
  macos-job:
    name: Run on macOS (${{ inputs.python_version || '3.13' }})
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check macOS environment
        run: |
          echo "=== Informasi Sistem macOS ==="
          sw_vers
          uname -m
          sysctl -n machdep.cpu.brand_string
          xcodebuild -version || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version || '3.13' }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run unit tests
        run: |
          python -m unittest discover -s tests -v

      - name: Run Playwright check (Optional)
        if: ${{ inputs.run_playwright_check == true }}
        run: |
          pip install playwright
          playwright install chromium
          python -c "
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page()
              page.goto('https://example.com')
              print('Page title:', page.title())
              assert 'Example Domain' in page.title()
              browser.close()
          "
